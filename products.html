<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Brew Haven Coffee</title>
  <meta name="description" content="Browse Brew Haven's coffee, pastries and merch. Order ahead and pick up at the counter.">
  <meta name="theme-color" content="#23150f">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="data/seed.js"></script>
  <script defer src="store.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="menu">
<main id="main">

  <section class="page-hero">
    <div class="ring" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow">The menu</p>
      <h1>Pull up a chair. <em class="accent">What'll it be?</em></h1>
      <p class="lead">Espresso drinks, pastries baked that morning, and a few things to take home. Rate your favorites with beans. We read every one.</p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0;padding-bottom:clamp(64px,10vw,120px)">
    <div class="container">
      <div class="toolbar" role="search">
        <div class="chips" role="group" aria-label="Filter by category">
          <button class="chip-btn" type="button" data-filter="All" aria-pressed="true">All</button>
          <button class="chip-btn" type="button" data-filter="Coffee" aria-pressed="false">Coffee</button>
          <button class="chip-btn" type="button" data-filter="Pastry" aria-pressed="false">Pastries</button>
          <button class="chip-btn" type="button" data-filter="Merch" aria-pressed="false">Merch</button>
        </div>
        <div class="toolbar-right">
          <label class="search-field">
            <span class="sr-only">Search the menu</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="searchBar" placeholder="Search latte, croissant…" autocomplete="off">
          </label>
          <label>
            <span class="sr-only">Sort items</span>
            <select id="sortSelect">
              <option value="default">Featured</option>
              <option value="priceAsc">Price: low to high</option>
              <option value="priceDesc">Price: high to low</option>
              <option value="nameAsc">Name: A–Z</option>
              <option value="nameDesc">Name: Z–A</option>
            </select>
          </label>
        </div>
      </div>
      <p class="result-count" id="resultCount" aria-live="polite">Loading the menu…</p>
      <div id="productList" class="product-grid"></div>
    </div>
  </section>

</main>
</body>
</html>
