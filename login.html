<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Brew Haven Coffee</title>
  <meta name="description" content="Sign in to your Brew Haven account.">
  <meta name="theme-color" content="#23150f">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="data/seed.js"></script>
  <script defer src="store.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="login">
<main id="main" class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-box">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in</h1>
      <p class="sub">Track your orders and loyalty beans, or open the staff dashboard.</p>

      <div class="alert" id="alertBox" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username or email</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-pw="password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="split-line">
          <label class="checkbox-line"><input type="checkbox" id="rememberMe"> Keep me signed in</label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-block">Sign in <span class="arrow" aria-hidden="true">→</span></button>
      </form>

      <p class="auth-foot">New here? <a href="register.html">Create an account</a></p>

      <section class="demo-box" aria-labelledby="demoTitle">
        <h2 id="demoTitle">Demo accounts</h2>
        <div class="row">
          <span><strong>Admin</strong><br><code>admin</code> / <code>admin123</code></span>
          <button class="btn btn-sm btn-dark" type="button" data-demo="admin|admin123">Use admin</button>
        </div>
        <div class="row">
          <span><strong>Customer</strong><br><code>customer</code> / <code>customer123</code></span>
          <button class="btn btn-sm btn-ghost" type="button" data-demo="customer|customer123">Use customer</button>
        </div>
      </section>
    </div>
  </div>
  <div class="auth-art">
    <img src="images/americano.jpg" alt="">
    <blockquote>"Life happens, coffee helps."<cite>Brew Haven house motto</cite></blockquote>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alertBox');
  const next = new URLSearchParams(location.search).get('next');
  const show = (msg, type) => { alertBox.textContent = msg; alertBox.className = 'alert show ' + type; };

  if (next) show('Please sign in to continue.', 'info');

  document.querySelectorAll('.pw-toggle').forEach(b => b.addEventListener('click', () => {
    const input = document.getElementById(b.dataset.pw);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    b.textContent = showing ? 'Show' : 'Hide';
    b.setAttribute('aria-pressed', String(!showing));
  }));

  document.querySelectorAll('[data-demo]').forEach(b => b.addEventListener('click', () => {
    const [u, p] = b.dataset.demo.split('|');
    form.username.value = u;
    form.password.value = p;
    form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true }));
  }));

  document.getElementById('forgotLink').addEventListener('click', e => {
    e.preventDefault();
    show('Password resets are handled at the counter for now. Ask any barista and they will sort you out.', 'info');
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!form.username.value.trim() || !form.password.value) { show('Enter your username and password.', 'error'); return; }
    const user = Auth.login(form.username.value, form.password.value);
    if (!user) { show('That username and password do not match. Try again.', 'error'); form.password.select(); return; }
    show('Welcome back, ' + user.firstName + '! Taking you in…', 'success');
    const safeNext = next && /^[\w-]+\.html$/.test(next) ? next : null;
    setTimeout(() => { location.href = safeNext || (user.role === 'admin' ? 'admin.html' : 'index.html'); }, 700);
  });
});
</script>
</body>
</html>
