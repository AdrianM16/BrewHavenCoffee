<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social preview | Brew Haven Coffee</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#23150f">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="data/seed.js"></script>
  <script defer src="store.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="mock">
<main id="main">
  <section class="page-hero no-print">
    <div class="ring" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow">Marketing preview · Social</p>
      <h1>Ready to post.</h1>
      <p class="lead">Switch platforms to see how your message reads in each feed.</p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0">
    <div class="container">
      <div class="tabs no-print" role="tablist" aria-label="Platforms" style="margin-inline:auto">
        <button class="tab" role="tab" id="t-facebook" aria-controls="p-facebook" data-platform="facebook">Facebook</button>
        <button class="tab" role="tab" id="t-instagram" aria-controls="p-instagram" data-platform="instagram">Instagram</button>
        <button class="tab" role="tab" id="t-x" aria-controls="p-x" data-platform="x">X</button>
        <button class="tab" role="tab" id="t-tiktok" aria-controls="p-tiktok" data-platform="tiktok">TikTok</button>
      </div>

      <div role="tabpanel" id="p-facebook" aria-labelledby="t-facebook">
        <article class="post">
          <div class="post-head"><div class="post-avatar"><img src="logo.svg" alt=""></div><div><div class="post-name">Brew Haven Coffee Shop</div><div class="post-sub">Just now · 🌍</div></div></div>
          <p class="post-text" data-msg data-tags="#BrewHaven #CoffeeLovers #ManilaEats"></p>
          <img class="post-img" src="images/about-brew.jpg" alt="">
          <div class="post-actions"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div>
        </article>
      </div>

      <div role="tabpanel" id="p-instagram" aria-labelledby="t-instagram" hidden>
        <article class="post">
          <div class="post-head"><div class="post-avatar"><img src="logo.svg" alt=""></div><div class="post-name">brewhavencoffee</div></div>
          <img class="post-img square" src="images/latte.jpg" alt="">
          <div class="post-actions" style="justify-content:flex-start;gap:16px;border:0;font-size:1.2rem"><span>♡</span><span>💬</span><span>➤</span></div>
          <p class="post-text"><strong>brewhavencoffee</strong> <span data-msg data-tags="#BrewHaven #CoffeeLove #ManilaEats"></span></p>
        </article>
      </div>

      <div role="tabpanel" id="p-x" aria-labelledby="t-x" hidden>
        <article class="post dark">
          <div class="post-head"><div class="post-avatar"><img src="logo.svg" alt=""></div><div><span class="post-name">Brew Haven</span> <span class="post-sub">@brewhavencoffee · now</span></div></div>
          <p class="post-text" data-msg data-tags="#BrewHaven #CoffeeLovers"></p>
          <img class="post-img" src="images/cold.jpg" alt="">
          <div class="post-actions"><span>💬 12</span><span>🔁 34</span><span>♡ 210</span><span>📊 4.1K</span></div>
        </article>
      </div>

      <div role="tabpanel" id="p-tiktok" aria-labelledby="t-tiktok" hidden>
        <article class="post tiktok">
          <img src="images/mocha.jpg" alt="">
          <div class="tt-side" aria-hidden="true"><span>♥</span><span>💬</span><span>↗</span></div>
          <div class="tt-over"><strong>@brewhavencoffee</strong><p style="margin:6px 0 0;white-space:pre-wrap" data-msg data-tags="#BrewHaven #CoffeeTok #Manila"></p></div>
        </article>
      </div>

      <div class="center no-print" style="margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn" type="button" onclick="window.print()">Print or save as PDF</button>
        <a class="btn btn-ghost" href="contact.html#marketing">Write another</a>
      </div>
    </div>
  </section>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  let data = null;
  try { data = JSON.parse(sessionStorage.getItem('lastContactMessage') || 'null'); } catch (e) {}
  const text = data && data.message ? data.message : 'Your daily dose of happiness in a cup ☕✨ Come visit us for fresh brews and pastries baked this morning.';
  document.querySelectorAll('[data-msg]').forEach(el => { el.textContent = text + '\n\n' + el.dataset.tags; });

  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  const allowed = data && data.platformsSelected && data.platformsSelected.length ? data.platformsSelected : null;
  if (allowed) tabs.forEach(t => { if (!allowed.includes(t.dataset.platform)) t.hidden = true; });
  const visible = () => tabs.filter(t => !t.hidden);
  function select(tab, focus) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tab.focus();
  }
  tabs.forEach(t => {
    t.addEventListener('click', () => select(t));
    t.addEventListener('keydown', e => {
      const v = visible(); const i = v.indexOf(t);
      if (e.key === 'ArrowRight') select(v[(i + 1) % v.length], true);
      if (e.key === 'ArrowLeft') select(v[(i - 1 + v.length) % v.length], true);
    });
  });
  const want = new URLSearchParams(location.search).get('platform');
  select(visible().find(t => t.dataset.platform === want) || visible()[0]);
});
</script>
</body>
</html>
