<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile | Brew Haven Coffee</title>
  <meta name="theme-color" content="#23150f">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="data/seed.js"></script>
  <script defer src="store.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="profile" data-guard="user">
<main id="main">

  <section class="page-hero page-hero-dark">
    <div class="ring" aria-hidden="true"></div>
    <div class="container profile-hero">
      <div class="profile-avatar" id="pAvatar" aria-hidden="true">?</div>
      <div>
        <p class="eyebrow" id="pRole">Member</p>
        <h1 id="pName" style="margin-bottom:.2em">Your profile</h1>
        <p class="lead" id="pEmail" style="margin:0"></p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="kpis">
        <div class="kpi reveal" style="--i:0"><div class="label">Orders placed</div><div class="value" id="kOrders">0</div></div>
        <div class="kpi reveal" style="--i:1"><div class="label">Loyalty beans</div><div class="value" id="kBeans">0</div></div>
        <div class="kpi reveal" style="--i:2"><div class="label">Items rated</div><div class="value" id="kRated">0</div></div>
        <div class="kpi reveal" style="--i:3"><div class="label">Total spent</div><div class="value" id="kSpent">₱0</div></div>
      </div>

      <div class="grid grid-2" style="align-items:start">
        <section class="panel reveal" aria-labelledby="detailsTitle">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">
            <h2 id="detailsTitle" style="font-size:1.6rem;margin:0">Account details</h2>
            <button class="btn btn-sm btn-ghost" type="button" id="editBtn">Edit details</button>
          </div>
          <dl class="dl-grid" id="details"></dl>
        </section>

        <section class="panel reveal" style="--i:1" aria-labelledby="ordersTitle">
          <h2 id="ordersTitle" style="font-size:1.6rem">Recent orders</h2>
          <div id="orders"></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
            <button class="btn btn-sm btn-ghost" type="button" id="pwBtn">Change password</button>
            <button class="btn btn-sm btn-ghost" type="button" data-logout>Sign out</button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <dialog class="modal" id="editDialog" aria-labelledby="editTitle">
    <form method="dialog" id="editForm">
      <div class="modal-head"><h2 id="editTitle">Edit details</h2><button class="close-x" value="cancel" formnovalidate aria-label="Close">×</button></div>
      <div class="modal-body">
        <div class="alert" id="editAlert" role="alert"></div>
        <div class="form-row">
          <div class="field"><label for="eFirst">First name</label><input id="eFirst" type="text" required autocomplete="given-name"></div>
          <div class="field"><label for="eLast">Last name</label><input id="eLast" type="text" required autocomplete="family-name"></div>
        </div>
        <div class="field"><label for="eEmail">Email</label><input id="eEmail" type="email" required autocomplete="email"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="save">Save changes</button></div>
    </form>
  </dialog>

  <dialog class="modal" id="pwDialog" aria-labelledby="pwTitle">
    <form method="dialog" id="pwForm">
      <div class="modal-head"><h2 id="pwTitle">Change password</h2><button class="close-x" value="cancel" formnovalidate aria-label="Close">×</button></div>
      <div class="modal-body">
        <div class="alert" id="pwAlert" role="alert"></div>
        <div class="field"><label for="pwCurrent">Current password</label><input id="pwCurrent" type="password" required autocomplete="current-password"></div>
        <div class="field"><label for="pwNew">New password</label><input id="pwNew" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field"><label for="pwConfirm">Confirm new password</label><input id="pwConfirm" type="password" required autocomplete="new-password"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="save">Update password</button></div>
    </form>
  </dialog>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const { esc, peso, toast, lsGet } = window.BH;
  const user = Auth.getCurrentUser();
  if (!user) return;

  function render() {
    const u = Auth.getCurrentUser();
    document.getElementById('pAvatar').textContent = (u.firstName || u.username).charAt(0).toUpperCase();
    document.getElementById('pName').textContent = `${u.firstName} ${u.lastName}`;
    document.getElementById('pEmail').textContent = u.email;
    document.getElementById('pRole').textContent = u.role === 'admin' ? 'Staff · Admin' : 'Brew Haven member';
    const since = new Date(u.createdAt).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('details').innerHTML = [
      ['Username', u.username], ['Email', u.email], ['First name', u.firstName], ['Last name', u.lastName],
      ['Account type', u.role === 'admin' ? 'Admin' : 'Customer'], ['Member since', since]
    ].map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
  }
  render();

  const orders = lsGet('bh_orders', []).filter(o => o.user === user.username).reverse();
  const ratings = lsGet('bh_ratings_v1', {});
  document.getElementById('kOrders').textContent = orders.length;
  document.getElementById('kBeans').textContent = orders.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0);
  document.getElementById('kRated').textContent = Object.values(ratings).filter(Boolean).length;
  document.getElementById('kSpent').textContent = peso(orders.reduce((s, o) => s + o.total, 0));
  document.getElementById('orders').innerHTML = orders.length
    ? `<ul class="hours" style="color:var(--ink)">${orders.slice(0, 6).map(o => `<li><span><strong>${esc(o.id)}</strong><br><small class="muted">${new Date(o.date).toLocaleDateString('en-PH')} · ${o.items.map(i => esc(i.qty + '× ' + i.name)).join(', ')}</small></span><span>${peso(o.total)}</span></li>`).join('')}</ul>`
    : `<p class="muted">No orders yet. <a href="products.html">Browse the menu</a> and place your first one.</p>`;

  // edit details
  const editDialog = document.getElementById('editDialog');
  document.getElementById('editBtn').addEventListener('click', () => {
    const u = Auth.getCurrentUser();
    eFirst.value = u.firstName; eLast.value = u.lastName; eEmail.value = u.email;
    document.getElementById('editAlert').className = 'alert';
    editDialog.showModal();
  });
  document.getElementById('editForm').addEventListener('submit', e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    const a = document.getElementById('editAlert');
    if (!eFirst.value.trim() || !eLast.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(eEmail.value.trim())) {
      a.textContent = 'Please fill in your name and a valid email.'; a.className = 'alert show error'; return;
    }
    const res = Auth.updateProfile({ firstName: eFirst.value.trim(), lastName: eLast.value.trim(), email: eEmail.value.trim() });
    if (res.error) { a.textContent = res.error; a.className = 'alert show error'; return; }
    editDialog.close(); render(); toast('Profile updated');
  });

  // change password
  const pwDialog = document.getElementById('pwDialog');
  document.getElementById('pwBtn').addEventListener('click', () => { document.getElementById('pwForm').reset(); document.getElementById('pwAlert').className = 'alert'; pwDialog.showModal(); });
  document.getElementById('pwForm').addEventListener('submit', e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    const a = document.getElementById('pwAlert');
    if (pwNew.value !== pwConfirm.value) { a.textContent = 'The new passwords do not match.'; a.className = 'alert show error'; return; }
    const res = Auth.changePassword(pwCurrent.value, pwNew.value);
    if (res.error) { a.textContent = res.error; a.className = 'alert show error'; return; }
    pwDialog.close(); toast('Password updated');
  });
});
</script>
</body>
</html>
