<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | Brew Haven Coffee</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#23150f">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="data/seed.js"></script>
  <script defer src="store.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="customers" data-guard="admin">
<main id="main">
  <section class="page-hero">
    <div class="ring" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow">Staff · Customers</p>
      <h1>Our regulars.</h1>
      <p class="lead">Loyalty members, their favorite drinks and how close they are to their next free cup.</p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0;padding-bottom:clamp(64px,10vw,120px)">
    <div class="container">
      <div class="panel-tools">
        <label class="search-field" style="max-width:420px"><span class="sr-only">Search customers</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="custSearch" placeholder="Search by name, email or phone…"></label>
        <a class="btn btn-sm btn-ghost" href="admin.html#customers">Manage in dashboard</a>
      </div>
      <p class="result-count" id="custCount" aria-live="polite" style="margin-top:8px"></p>
      <div id="custContainer" class="grid grid-3"></div>
    </div>
  </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  if (!Auth.isAdmin()) return;
  const { esc, observeReveals } = window.BH;
  const box = document.getElementById('custContainer');
  const all = await Store.list('customers');
  const max = Math.max(1, ...all.map(c => Number(c.loyalty_points) || 0));

  function render(q) {
    q = (q || '').toLowerCase().trim();
    const rows = all.filter(c => !q || [c.name, c.email, c.phone, c.favorite_drink].join(' ').toLowerCase().includes(q));
    document.getElementById('custCount').textContent = `${rows.length} customer${rows.length === 1 ? '' : 's'}`;
    box.innerHTML = rows.length ? rows.map((c, i) => `
      <article class="card person-card reveal" style="--i:${i % 3}">
        <header><span class="avatar" aria-hidden="true">${esc((c.name || '?').charAt(0))}</span>
          <div><h3>${esc(c.name)}</h3><span class="muted" style="font-size:.88rem">Member since ${c.joined ? new Date(c.joined).toLocaleDateString('en-PH', { month: 'short', year: 'numeric' }) : 'N/A'}</span></div></header>
        <dl>
          <dt>Email</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : 'N/A'}</dd>
          <dt>Phone</dt><dd>${esc(c.phone || 'N/A')}</dd>
          <dt>Favorite</dt><dd>${esc(c.favorite_drink || 'N/A')}</dd>
        </dl>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;margin-bottom:6px"><span>Loyalty points</span><span>${Number(c.loyalty_points || 0).toLocaleString()}</span></div>
          <div class="points-bar" aria-hidden="true"><span style="width:${((Number(c.loyalty_points) || 0) / max) * 100}%"></span></div>
        </div>
      </article>`).join('') : `<div class="empty-state" style="grid-column:1/-1"><p>No customers match your search.</p></div>`;
    observeReveals(box);
  }
  document.getElementById('custSearch').addEventListener('input', e => render(e.target.value));
  render('');
});
</script>
</body>
</html>
